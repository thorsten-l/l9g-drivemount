name: native-build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # TODO: sicherstellen, dass die Liberica-NIK-*Full*-Variante (mit LibericaFX)
      # installiert wird - sonst schlaegt --add-modules javafx.* fehl.
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: 'liberica'
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native image
        run: mvn -B -Pnative native:compile

      - uses: actions/upload-artifact@v4
        with:
          name: drivemount-${{ matrix.os }}
          path: |
            target/drivemount
            target/drivemount.exe
